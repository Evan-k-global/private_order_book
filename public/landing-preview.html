<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowBook | Landing Preview</title>
    <style>
      :root {
        --bg: #06090f;
        --surface: rgba(9, 18, 33, 0.9);
        --surface-alt: rgba(13, 24, 42, 0.92);
        --line: #223554;
        --ink: #e7f1fb;
        --muted: #8ca3bb;
        --cyan: #6bd6ff;
        --violet: #d074ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Söhne", "Inter", "IBM Plex Sans", sans-serif;
        background: radial-gradient(circle at top, rgba(18, 32, 57, 0.65), rgba(6, 9, 15, 0.98) 58%), var(--bg);
        position: relative;
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(4, 7, 13, 0.32), rgba(4, 7, 13, 0.76)),
          url('/assets/replace_the_people_with_crypto_Nano_Banana_2_75683.jpg') center bottom / cover no-repeat;
        opacity: 0.5;
        pointer-events: none;
      }
      main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }
      .shell {
        width: min(885px, 100%);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 22px;
        backdrop-filter: blur(10px);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
        overflow: hidden;
      }
      .hero {
        padding: 22px;
        display: grid;
        gap: 16px;
        align-content: start;
      }
      .hero > * {
        min-width: 0;
      }
      .hero-logo {
        width: 100%;
        max-width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 0 24px rgba(108, 214, 255, 0.15));
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid #315072;
        background: rgba(10, 22, 40, 0.8);
        color: #c4ddf6;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        width: fit-content;
      }
      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--cyan), var(--violet));
      }
      h1 {
        margin: 0;
        font-size: clamp(24px, 2.8vw, 38px);
        line-height: 1.04;
        letter-spacing: -0.03em;
        background: linear-gradient(90deg, #00b7ff 0%, #39d8ff 26%, #f7fbff 42%, #c66bff 56%, #7a33ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }
      .gate {
        padding: 22px 0 0;
        border-top: 1px solid #223654;
        display: grid;
        gap: 16px;
        align-content: start;
      }
      .gate h2 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #c8def4;
      }
      .code-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #88a1ba;
      }
      input,
      button,
      a.cta-link {
        width: 100%;
        border-radius: 12px;
        border: 1px solid #29405e;
        min-height: 44px;
        padding: 0 14px;
        font: inherit;
      }
      input {
        background: #0a1628;
        color: var(--ink);
      }
      button,
      a.cta-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        cursor: pointer;
        background: linear-gradient(120deg, #2a8cff, #25d0b5);
        color: #03111e;
        font-weight: 700;
      }
      button.secondary,
      a.cta-link.secondary {
        background: #0a1628;
        color: #b9d4ef;
      }
      .status {
        min-height: 22px;
        font-size: 13px;
        color: var(--muted);
      }
      .status.ok { color: #7ce7b9; }
      .status.err { color: #ff8ca1; }
      .mini {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      .hero-summary {
        max-width: 100%;
        width: 100%;
        white-space: nowrap;
        font-size: 13px;
        letter-spacing: -0.01em;
        overflow: hidden;
      }
      .gate-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
        gap: 18px;
        align-items: start;
        min-width: 0;
      }
      .access-meta,
      .community-card {
        display: grid;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid #223654;
        background: var(--surface-alt);
      }
      .actions {
        display: grid;
        gap: 12px;
      }
      .community-head {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
      }
      .community-head h3 {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #c8def4;
      }
      .community-icons {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        min-width: 0;
      }
      .icon-link {
        min-height: 52px;
        min-width: 0;
        padding: 0;
        border-radius: 14px;
        border: 1px solid #29405e;
        background: #0a1628;
        color: #b9d4ef;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }
      .icon-link svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-link svg.fill-icon {
        fill: currentColor;
        stroke: none;
      }
      .icon-link.placeholder {
        border-style: dashed;
      }
      .footer-note {
        font-size: 11px;
        color: #7f94ab;
      }
      @media (max-width: 920px) {
        .hero-summary {
          white-space: normal;
        }
        .gate-grid {
          grid-template-columns: 1fr;
        }
        .community-icons {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <section class="hero">
          <span class="eyebrow">Early Access</span>
          <img
            class="hero-logo"
            src="/assets/Untitled design.jpg"
            alt="ShadowBook"
          />
          <h1>ShadowBook - Private Order Book on Zeko</h1>
          <p class="hero-summary">
            ShadowBook combines fast off-chain matching with note-backed trading and lean on-chain settlement.
          </p>
          <section class="gate">
            <div class="gate-grid">
              <div>
                <h2>Early Access</h2>
                <div style="height: 10px;"></div>
                <div>
                  <div class="code-row">
                    <input id="accessCode" autocomplete="off" placeholder="SB-ALPHA-..." disabled />
                    <button id="redeemBtn" type="button" disabled>Preview Only</button>
                  </div>
                </div>
                <div id="status" class="status"></div>
              </div>
              <div class="community-card">
                <div class="community-head">
                  <h3>Developer Community</h3>
                </div>

                  </a>
                  <a class="icon-link placeholder" href="#" aria-disabled="true" title="X" aria-label="X">
                    <svg class="fill-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.24 2H21.5l-7.12 8.14L22.75 22h-6.56l-5.14-7.24L4.72 22H1.45l7.61-8.7L1 2h6.72l4.65 6.56L18.24 2Zm-1.15 18h1.8L6.73 3.9H4.84L17.09 20Z"/></svg>

                  <a class="icon-link secondary" href="https://zeko.io/" target="_blank" rel="noreferrer" title="Zeko Website" aria-label="Zeko Website">

                  <a class="icon-link secondary" href="https://docs.zeko.io/" target="_blank" rel="noreferrer" title="Zeko Docs" aria-label="Zeko Docs">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v16H7.5A2.5 2.5 0 0 0 5 21V5.5Z"></path><path d="M7.5 3A2.5 2.5 0 0 0 5 5.5V21"></path><path d="M9 7h6"></path><path d="M9 10h6"></path></svg>
                  </a>
                </div>
              </div>
            </div>
          </section>
        </section>
      </div>
    </main>

  </body>
</html>
